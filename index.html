*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0d13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}.game{height:100dvh;position:relative;background:linear-gradient(180deg,#66707d 0%,#30343d 50%,#12151b 100%)}

.choices{display:flex;gap:10px;flex-direction:column;margin-top:14px}.choice{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:white;padding:12px 16px;font:inherit;text-align:left;border-radius:2px}.choice:active{background:rgba(255,255,255,.18)}.hint{position:absolute;right:18px;top:22px;font-size:11px;opacity:.45}.fade{animation:fade .35s}@keyframes fade{from{opacity:.25}to{opacity:1}}
